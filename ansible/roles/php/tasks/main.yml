---
- name: Install Sury's GPG key.
  copy:
    src: sury.gpg
    dest: /usr/share/keyrings/deb.sury.org-php.gpg
    owner: root
    group: root
    mode: 0644
- name: Install Sury's repository
  deb822_repository:
    name: php_sury
    state: present
    uris: https://packages.sury.org/php/
    suites: "{{ ansible_distribution_release | lower }}"
    components: main
    signed_by: "/usr/share/keyrings/deb.sury.org-php.gpg"
- name: Install php{{ php_version }}
  apt:
    name:
      - php{{ php_version }}-fpm
      - php{{ php_version }}-cli
      - php{{ php_version }}-curl
      - php{{ php_version }}-dom
      - php{{ php_version }}-intl
      - php{{ php_version }}-mbstring
      - php{{ php_version }}-mysql
      - php{{ php_version }}-pdo
      - php{{ php_version }}-redis
      - php{{ php_version }}-sqlite3
      - php{{ php_version }}-xml
      - php{{ php_version }}-zip
    state: present
    update_cache: yes
- name: Install php{{ php_version }}-opcache
  apt:
    name:
      - php{{ php_version }}-opcache
    state: present
    update_cache: yes
  when: "php_version is version('8.5', '<')"
- name: Install pool config www.conf.
  template:
    src: www.conf
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    owner: root
    group: root
    mode: 0644
  notify:
    - restart php{{ php_version }}
- name: Install composer
  apt:
    name:
      - composer
      - unzip
    state: present
    update_cache: yes
- name: Start php{{ php_version }}-fpm
  service:
    name: php{{ php_version }}-fpm
    state: started
- name: Create webroot
  file:
    path: /var/www/
    state: directory
    owner: www-data
    group: www-data
    mode: 0755
